name: fitness_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.2
  flutter_native_splash: ^2.4.7
  image_picker: ^1.2.1
  http: ^1.6.0
  flutter_svg: ^2.2.3
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.4
  lottie: ^3.3.2
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  flutter_bloc: ^9.1.1
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/IconLuncher/
    - assets/lottie/
    - assets/svgs/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/IconLuncher/PharoFitIcon3x.png"
  adaptive_icon_background: "#000000000"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/IconLuncher/PharoFitIcon3x.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/IconLuncher/PharoFitIcon3x.png"